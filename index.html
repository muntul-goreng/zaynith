<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Zaynith </title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
  color: #fff;
}

header, .actions, footer {
  display: none;
}

.main {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.video-wrapper {
  width: 100%;
  height: 100%;
}

video {
  display: block;
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  background: #000;
}

.message {
  padding: 24px;
  text-align: center;
  color: #fff;
  font-size: 18px;
}

.popup-overlay {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

.popup-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.popup-box {
  background: #111;
  padding: 26px;
  border-radius: 10px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  border: 1px solid #333;
}

.popup-box h3 {
  font-size: 18px;
  margin-bottom: 10px;
}

.popup-box p {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 18px;
  line-height: 1.5;
}

.popup-actions {
  display: flex;
  justify-content: center;
}

.popup-btn {
  background: #2563eb;
  border: none;
  color: #fff;
  padding: 12px 20px;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  max-width: 220px;
}

.popup-btn:hover {
  background: #1d4ed8;
}
</style>
</head>

<body>

<header>
  <div class="header-container">
    <div class="logo"> Zaynith </div>
    <a href="" class="upload-btn">Upload</a>
  </div>
</header>

<main class="main">
  <div class="video-wrapper" id="videoWrapper">
    <video id="video"
      autoplay
      muted
      playsinline
      controls
      controlsList="nodownload noplaybackrate">
    </video>
  </div>
</main>

<footer>© 2026  Zaynith </footer>

<script>
/*
  CARA GANTI VIDEO:
  URL:
  https://bbwsinglesfan.github.io/Viral/?id=jB50tUkK1

  Ganti kode setelah ?id= untuk memakai video lain.
  Kode default di bawah dipakai jika URL tidak memiliki ?id=.
*/
const DEFAULT_VIDEO_ID = "jB50tUkK1";

const video = document.getElementById("video");
const params = new URLSearchParams(window.location.search);

const requestedID = (params.get("id") || DEFAULT_VIDEO_ID).trim();
const VIDEO_ID = requestedID.replace(/\.(mp4|mov)$/i, "");

if (/^[a-zA-Z0-9_-]+$/.test(VIDEO_ID)) {
  const base = "https://cdn2.videy.co/" + encodeURIComponent(VIDEO_ID);

  video.addEventListener("error", function () {
    if (!video.dataset.movTried) {
      video.dataset.movTried = "1";
      video.src = base + ".mov";
      video.load();
    } else {
      document.getElementById("videoWrapper").innerHTML =
        '<div class="message">Video tidak dapat dimuat. Periksa kode video pada URL.</div>';
    }
  });

  video.src = base + ".mp4";
  video.load();
  video.play().catch(() => {});
} else {
  document.getElementById("videoWrapper").innerHTML =
    '<div class="message">Kode video tidak valid.</div>';
}
</script>

<!-- Popup pengingat menonton -->
<div class="popup-overlay" id="continuePopup">
  <div class="popup-box">
    <h3>Continue watching?</h3>
    <p>Press continue to keep watching the video.</p>
    <div class="popup-actions">
      <button class="popup-btn" onclick="continueVideo()">
        Continue Watching
      </button>
    </div>
  </div>
</div>

<script>
const popup = document.getElementById("continuePopup");
const videoPlayer = document.getElementById("video");
let halfTriggered = false;

function showPopup() {
  popup.classList.add("active");
  if (videoPlayer) videoPlayer.pause();
}

function continueVideo() {
  popup.classList.remove("active");
  if (videoPlayer) videoPlayer.play().catch(() => {});
}

const firstDelay = Math.floor(Math.random() * 8000) + 20000;

setTimeout(function () {
  showPopup();
  startRecurringPopup();
}, firstDelay);

function startRecurringPopup() {
  const interval = Math.floor(Math.random() * 60000) + 180000;
  setInterval(showPopup, interval);
}

if (videoPlayer) {
  videoPlayer.addEventListener("timeupdate", function () {
    if (!videoPlayer.duration) return;

    const progress = videoPlayer.currentTime / videoPlayer.duration;

    if (progress >= 0.5 && !halfTriggered) {
      halfTriggered = true;
      showPopup();
    }
  });
}
</script>
